name: Backend quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Windows contributors can commit mvnw without its Linux executable bit.
      # Make CI independent of that filesystem metadata before invoking Maven.
      - run: chmod +x ./mvnw
      - run: ./mvnw test
