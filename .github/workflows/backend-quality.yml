name: Backend quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Windows contributors can commit mvnw without its Linux executable bit.
      # Make CI independent of that filesystem metadata before invoking Maven.
      - run: chmod +x ./mvnw
      - run: ./mvnw test

  bootstrap-pgvector:
    name: Bootstrap V76 on PostgreSQL pgvector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start disposable pgvector database
        shell: bash
        run: |
          docker run --detach --name histar-postgres \
            --env POSTGRES_USER=timelens \
            --env POSTGRES_PASSWORD=timelens_secret \
            --env POSTGRES_DB=postgres \
            pgvector/pgvector:pg17
          for i in {1..30}; do
            if docker exec histar-postgres pg_isready -U timelens -d postgres; then exit 0; fi
            sleep 2
          done
          docker logs histar-postgres
          exit 1

      - name: Validate bootstrap artifact
        shell: pwsh
        run: ./docs/scripts/Test-HistarBootstrapSql.ps1

      - name: Validate bootstrap runner
        shell: pwsh
        run: ./docs/scripts/Test-HistarBootstrapRunner.ps1

      - name: Run full bootstrap and seed checks
        shell: pwsh
        run: >-
          ./docs/scripts/bootstrap-local-db.ps1
          -Database timelens_ci
          -Container histar-postgres
          -DbUser timelens
          -Reset

      - name: Verify pgvector extension and V76 baseline
        shell: bash
        run: |
          docker exec histar-postgres psql -U timelens -d timelens_ci -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname = 'vector';"
          docker exec histar-postgres psql -U timelens -d timelens_ci -v ON_ERROR_STOP=1 -c "SELECT version, type, success FROM flyway_schema_history WHERE version = '76' AND type = 'BASELINE' AND success = TRUE;"
