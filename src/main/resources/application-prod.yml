# Production — Render (BE) + PostgreSQL (Render) + FE (Vercel)
# Biến môi trường: xem BE/.env.production.example — paste vào Render Dashboard → Environment

spring:
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  jmx:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timelens}
    username: ${DB_USER:timelens}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Manual seed applies V1..V13 via psql; baseline at 13 avoids re-running on Render boot.
    baseline-version: 13
    locations: classpath:db/migration
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  # Render requires binding 0.0.0.0 — https://render.com/docs/web-services#port-binding
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.histar.be: INFO

payment:
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    bank-code: ${SEPAY_BANK_CODE:}
    account-number: ${SEPAY_ACCOUNT_NUMBER:}
    account-name: ${SEPAY_ACCOUNT_NAME:}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    qr-base-url: ${SEPAY_QR_BASE_URL:https://vietqr.app/img}
    qr-template: ${SEPAY_QR_TEMPLATE:compact}
    qr-show-info: ${SEPAY_QR_SHOW_INFO:true}
    b2c-premium-price-vnd: ${SEPAY_B2C_PREMIUM_PRICE_VND:49000}
    order-expiry-minutes: ${SEPAY_ORDER_EXPIRY_MINUTES:15}
    max-timestamp-skew-seconds: ${SEPAY_MAX_TIMESTAMP_SKEW_SECONDS:300}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://fe-lake-five.vercel.app}

chat:
  provider: ${CHAT_PROVIDER:gemini}
  hybrid-order: ${CHAT_HYBRID_ORDER:gemini}
  history-ai:
    enabled: ${HISTORY_AI_ENABLED:false}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}

demo:
  enabled: ${DEMO_ENABLED:false}

minio:
  endpoint: ${MINIO_ENDPOINT:}
  public-url: ${MINIO_PUBLIC_URL:}
  access-key: ${MINIO_ROOT_USER:}
  secret-key: ${MINIO_ROOT_PASSWORD:}
  bucket: ${MINIO_BUCKET_NAME:timelens-media}

histar:
  app:
    frontend-url: ${FRONTEND_URL:https://fe-lake-five.vercel.app}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:}
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
