# Production — Render (BE) + PostgreSQL (Render) + FE (Vercel)
# Biến môi trường: xem BE/.env.production.example — paste vào Render Dashboard → Environment

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timelens}
    username: ${DB_USER:timelens}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Không auto-migrate — chạy SQL seed thủ công trên Postgres Render trước deploy
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.histar.be: INFO

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://fe-lake-five.vercel.app}

chat:
  provider: ${CHAT_PROVIDER:gemini}
  hybrid-order: ${CHAT_HYBRID_ORDER:gemini}
  history-ai:
    enabled: ${HISTORY_AI_ENABLED:false}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}

demo:
  enabled: ${DEMO_ENABLED:false}

minio:
  endpoint: ${MINIO_ENDPOINT:}
  public-url: ${MINIO_PUBLIC_URL:}
  access-key: ${MINIO_ROOT_USER:}
  secret-key: ${MINIO_ROOT_PASSWORD:}
  bucket: ${MINIO_BUCKET_NAME:timelens-media}
