spring:
  application:
    name: BE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timelens}
    username: ${DB_USER:timelens}
    password: ${DB_PASSWORD:timelens_secret}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET:change-me-to-at-least-32-characters-long}
  expiration: 86400000
  refresh-expiration: 604800000

chat:
  provider: ${CHAT_PROVIDER:hybrid}
  hybrid-order: ${CHAT_HYBRID_ORDER:history-ai,ollama,gemini}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b-instruct}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
  history-ai:
    base-url: ${HISTORY_AI_BASE_URL:http://localhost:8000}
    enabled: ${HISTORY_AI_ENABLED:true}
    timeout-seconds: ${HISTORY_AI_TIMEOUT_SECONDS:120}
  rag-ai:
    base-url: ${RAG_AI_BASE_URL:http://localhost:8100}
    timeout-seconds: ${RAG_AI_TIMEOUT_SECONDS:120}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.6-flash}
  daily-message-limit: ${GEMINI_DAILY_MESSAGE_LIMIT:50}

rag:
  # B5 pgvector RAG. Off by default: chat keeps using the legacy RAG-AI / LLM path.
  enabled: ${RAG_ENABLED:false}
  top-k: ${RAG_TOP_K:4}
  max-distance: ${RAG_MAX_DISTANCE:0.6}
  embedding:
    model: ${RAG_EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:768}
    timeout-seconds: ${RAG_EMBEDDING_TIMEOUT_SECONDS:15}
  cache:
    enabled: ${RAG_CACHE_ENABLED:false}
    ttl-minutes: ${RAG_CACHE_TTL_MINUTES:1440}
    max-distance: ${RAG_CACHE_MAX_DISTANCE:0.05}

pack:
  # Prefix for API-served pack assets (faq_offline.json). Empty = relative path (FE resolves against VITE_API_URL).
  api-base-url: ${PACK_API_BASE_URL:}
gamification:
  checkin-radius-meters: ${GAMIFICATION_CHECKIN_RADIUS_METERS:100}
  level-thresholds: ${GAMIFICATION_LEVEL_THRESHOLDS:0,100,300,600,1000}
  level-names: ${GAMIFICATION_LEVEL_NAMES:Lữ hành mới,Nhà khám phá,Sử học gia,Người gìn giữ di sản,Huyền thoại lịch sử}
  rules-engine-enabled: ${GAMIFICATION_RULES_ENGINE_ENABLED:false}

presence:
  # Empty = accept unsigned station QR (DEMO only). Set in production to require HMAC-SHA256.
  qr-hmac-secret: ${PRESENCE_QR_HMAC_SECRET:}
  qr-max-skew-minutes: ${PRESENCE_QR_MAX_SKEW_MINUTES:15}

visit:
  session:
    idle-timeout-minutes: ${VISIT_SESSION_IDLE_TIMEOUT_MINUTES:30}

demo:
  enabled: ${DEMO_ENABLED:false}
  secret: ${DEMO_SECRET:}

payment:
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    bank-code: ${SEPAY_BANK_CODE:}
    account-number: ${SEPAY_ACCOUNT_NUMBER:}
    account-name: ${SEPAY_ACCOUNT_NAME:}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    api-key: ${SEPAY_API_KEY:}
    webhook-auth-mode: ${SEPAY_WEBHOOK_AUTH_MODE:auto}
    qr-base-url: ${SEPAY_QR_BASE_URL:https://vietqr.app/img}
    qr-template: ${SEPAY_QR_TEMPLATE:compact}
    qr-show-info: ${SEPAY_QR_SHOW_INFO:true}
    b2c-premium-price-vnd: ${SEPAY_B2C_PREMIUM_PRICE_VND:49000}
    order-expiry-minutes: ${SEPAY_ORDER_EXPIRY_MINUTES:15}
    expiry-grace-minutes: ${SEPAY_EXPIRY_GRACE_MINUTES:30}
    max-timestamp-skew-seconds: ${SEPAY_MAX_TIMESTAMP_SKEW_SECONDS:300}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET_NAME:timelens-media}

media:
  base-url: ${MEDIA_BASE_URL:https://fe-lake-five.vercel.app}
  transcode:
    ffmpeg-path: ${MEDIA_FFMPEG_PATH:ffmpeg}
    passthrough-when-no-ffmpeg: ${MEDIA_TRANSCODE_PASSTHROUGH:false}
    max-bytes: ${MEDIA_TRANSCODE_MAX_BYTES:8388608}
    poll-ms: ${MEDIA_TRANSCODE_POLL_MS:15000}

viral:
  share-bonus-points: ${VIRAL_SHARE_BONUS_POINTS:15}
  share-caption: ${VIRAL_SHARE_CAPTION:Khám phá di sản Việt cùng TimeLens! #TimeLens #DiSanVietNam}
  leaderboard-limit: ${VIRAL_LEADERBOARD_LIMIT:50}
  leaderboard-cache-seconds: ${VIRAL_LEADERBOARD_CACHE_SECONDS:60}

histar:
  sales-inbox: ${SALES_INBOX:}
  app:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:true}
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:noreply@histar.vn}
    verification-ttl-hours: 24
    resend-cooldown-seconds: 60
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  org:
    invite-ttl-days: 7
  group:
    code-ttl-days: 30
    max-groups-per-user: 20
  tier:
    free-chat-daily-limit: 10
    free-photo-frame-ids: classic,heritage
  test-hooks:
    enabled: ${HISTAR_TEST_HOOKS_ENABLED:false}
    secret: ${HISTAR_TEST_HOOKS_SECRET:}

resend:
  api-key: ${RESEND_API_KEY:}

brevo:
  api-key: ${BREVO_API_KEY:}

server:
  port: 8080

# Optional crash reporting — blank DSN = disabled (docs/SENTRY_ENABLE.md)
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always
