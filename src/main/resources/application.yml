spring:
  application:
    name: BE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timelens}
    username: ${DB_USER:timelens}
    password: ${DB_PASSWORD:timelens_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:change-me-to-at-least-32-characters-long}
  expiration: 86400000

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  daily-message-limit: ${GEMINI_DAILY_MESSAGE_LIMIT:50}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET_NAME:timelens-media}

server:
  port: 8080

kind: Application
