# VPS overlay. Activate together with prod: SPRING_PROFILES_ACTIVE=prod,vps.
# Secrets remain environment variables supplied by docker-compose.prod.yml.
spring:
  main:
    lazy-initialization: false
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 1500000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s

chat:
  provider: ${CHAT_PROVIDER:hybrid}
  hybrid-order: ${CHAT_HYBRID_ORDER:history-ai,gemini}
  history-ai:
    # The deployed FastAPI service exposes /ai/chat, not legacy /api/chat.
    enabled: false
    base-url: ${HISTORY_AI_BASE_URL:http://histar-ai:8100}
  rag-ai:
    base-url: ${RAG_AI_BASE_URL:http://histar-ai:8100}
    timeout-seconds: ${RAG_AI_TIMEOUT_SECONDS:100}

histar:
  rate-limit:
    redis:
      enabled: true

management:
  health:
    redis:
      enabled: true
  endpoint:
    health:
      show-details: never
