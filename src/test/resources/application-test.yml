spring:
  datasource:
    url: jdbc:h2:mem:timelens_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: false
        jdbc:
          lob:
            non_contextual_creation: true

jwt:
  secret: test-jwt-secret-at-least-32-characters-long
  expiration: 86400000

gamification:
  checkin-radius-meters: 100
  level-thresholds: 0,100,300,700

visit:
  session:
    idle-timeout-minutes: 30

minio:
  endpoint: http://localhost:9000
  public-url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: timelens-media

viral:
  share-bonus-points: 15
  leaderboard-limit: 10
  leaderboard-cache-seconds: 60

cors:
  allowed-origins: http://localhost:5173
